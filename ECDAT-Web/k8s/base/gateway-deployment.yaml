# ECDAT API Gateway Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecdat-gateway
  namespace: ecdat
  labels: {app: ecdat-gateway, tier: gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: ecdat-gateway}}
  template:
    metadata: {labels: {app: ecdat-gateway, tier: gateway}}
    spec:
      containers:
        - name: gateway
          image: ecdat-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: GATEWAY_PORT, value: "8000"}
            - {name: CLASS_A_URL, value: "http://ecdat-class-a:8080"}
            - {name: CLASS_B_URL, value: "http://ecdat-llm:8080"}
            - {name: CLASS_C_URL, value: "http://ecdat-stateful:8080"}
            - {name: CLASS_E_URL, value: "http://ecdat-class-e:8080"}
            - {name: STANDALONE_FALLBACK, value: "true"}
            - {name: RATE_LIMIT_PER_MINUTE, value: "120"}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "512Mi"}
          livenessProbe: {httpGet: {path: /healthz, port: 8000},
                          initialDelaySeconds: 5, periodSeconds: 15, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /readyz, port: 8000},
                           initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: ecdat-gateway, namespace: ecdat, labels: {app: ecdat-gateway}}
spec:
  type: ClusterIP
  ports: [{port: 8000, targetPort: 8000, name: http}]
  selector: {app: ecdat-gateway}
