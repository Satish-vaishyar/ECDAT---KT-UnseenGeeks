# ECDAT Secrets Configuration Template
# DO NOT commit production secrets to version control!
# Use this template with 'kubectl apply -f' or create secrets directly via CLI:
#
# 1. HuggingFace Token (for Class B LLM model weights downloading)
#    kubectl create secret generic hf-token \
#      --namespace=ecdat-llm \
#      --from-literal=token="YOUR_HUGGINGFACE_TOKEN"
#
# 2. Neo4j Credentials (for Class C Knowledge Graph database)
#    kubectl create secret generic neo4j-credentials \
#      --namespace=ecdat \
#      --from-literal=uri="neo4j+s://your-neo4j-instance.databases.neo4j.io" \
#      --from-literal=user="neo4j" \
#      --from-literal=password="YOUR_NEO4J_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: ecdat-llm
type: Opaque
stringData:
  token: "hf_PLACEHOLDER_TOKEN_REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: ecdat
type: Opaque
stringData:
  uri: "neo4j+s://placeholder-uri:7687"
  user: "neo4j"
  password: "placeholder-password"
